name: Build APK Bersih Tanpa Watermark
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Pasang Cordova dan Bakar APK
        run: |
          npm install -g cordova
          cordova create YourApp com.lu.yourtask YourTask
          cd YourApp
          rm -rf www/*
          cp -r ../* www/ || true
          cordova platform add android
          cordova build android --bundle
      - name: Upload File APK Jadi Lu
        uses: actions/upload-artifact@v4
        with:
          name: YourTask-App-Bersih
          path: YourApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
